name: Verify paired portable resources
on:
  workflow_dispatch:
  release:
    types: [published]
permissions:
  contents: read
jobs:
  windows-portable:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Download and verify the locked release asset
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $release = (Get-Content runtime.lock.json -Raw | ConvertFrom-Json).release
          gh release download $release.tag --repo $release.repository --pattern $release.asset
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ((Get-FileHash -LiteralPath $release.asset -Algorithm SHA256).Hash.ToLowerInvariant() -ne $release.sha256) {
            throw "Resource archive hash mismatch"
          }
          Expand-Archive -LiteralPath $release.asset -DestinationPath .
      - name: Rebuild with only project-local tools and offline package managers
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\bootstrap.ps1 setup
      - name: Initialize independent database
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\bootstrap.ps1 init
      - name: Check database and frontend readiness
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\bootstrap.ps1 check
      - name: Inspect installed runtime
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\bootstrap.ps1 doctor
      - name: Unit, HTTP and frontend regression tests
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\bootstrap.ps1 test
      - name: Verify committed source manifest
        run: .\.runtime\python\python.exe scripts/collaboration_snapshot.py --verify
